[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noisy-iqp-paper"
version = "1.0.0"
description = "Code and archived results for the noisy IQP connectivity study"
authors = [{ name = "Leonardo Placidi" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "networkx==3.4.2",
    "qiskit==2.3.1",
    "pytket==2.15.0",
    "pytket-qiskit==0.77.0",
    "scipy==1.15.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
